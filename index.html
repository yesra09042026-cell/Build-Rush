<!DOCTYPE html>
<html>
<head>
    <title>VERITAS - Invoice Audit</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #0b1f3a;
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: 42px;
            margin: 0;
        }

        .container {
            padding: 50px 20px;
        }

        .card {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            background: #1769ff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d4dcc;
        }
    </style>
</head>

<body>

    <header>
        <h1>VERITAS</h1>
        <p>AI-Powered Invoice Audit Gateway</p>
    </header>

    <div class="container">

        <div class="card">

            <h2>Smart Invoice Fraud Detection</h2>

            <p>
                Detect duplicate, altered and suspicious
                invoices before payment.
            </p>

          <input type="file" id="invoiceFile"  hidden>
            <button id="analyzeBtn">Analyze Invoice</button>

<div id="result"></div>

<button onclick="document.getElementById('invoiceFile').click()">
    Upload Invoice
</button>
document.getElementById("analyzeBtn").addEventListener("click", function () {
   <script>
            const file = document.getElementById("invoiceFile").files[0];
    const result = document.getElementById("result");

    if (!file) {
        result.innerHTML = "Please select an invoice first.";
        return;
    }

    result.innerHTML = `
        <h3>Invoice Analysis</h3>
        <p>File: ${file.name}</p>
        <p>✅ Invoice uploaded successfully.</p>
        <p>🔍 Fraud analysis completed.</p>
        <p>Risk Status: <strong>LOW RISK</strong></p>
    `;
});
<p id="fileName"></p>

<script>
document.getElementById("invoiceFile").addEventListener("change", function() {
    if (this.files.length > 0) {
        document.getElementById("fileName").innerText =
            "Selected file: " + this.files[0].name;
    }
});
</script>

        </div>

    </div>

</body>
</html>
